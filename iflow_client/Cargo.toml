[package]
name = "iflow_client"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
rand = "0.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
reqwest = { version = "0.13.2", features = ["json", "cookies"] }
dashmap = { version = "6.1.0", features = ["serde"] }
anyhow = "1.0.101"
dotenvy = "0.15.7"
toml = "1.0.3"